<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — SalaJá</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#003B73" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body data-page="dashboard">
    <div class="app-layout">
      <aside class="sidebar" id="appSidebar">
        <div class="sidebar-header"><a class="logo-wrapper" href="index.html"><img src="logo.png" alt="" width="32"><h2>SalaJá</h2></a><button class="icon-btn close-sidebar mobile-only" id="closeSidebar" aria-label="Fechar menu">×</button></div>
        <div class="sidebar-content">
          <div class="nav-section-title">Principal</div>
          <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-link" data-nav="dashboard"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="index.html" class="nav-link" data-nav="spaces"><i data-lucide="compass"></i> Explorar espaços</a>
            <a href="reserva.html" class="nav-link" data-nav="reserve"><i data-lucide="calendar-plus"></i> Pedir reserva</a>
            <a href="minhas-reservas.html" class="nav-link" data-nav="reservations"><i data-lucide="calendar-check"></i> As minhas reservas</a>
            <a href="admin.html" class="nav-link" data-nav="admin" data-admin-nav hidden><i data-lucide="shield-check"></i> Validar pedidos</a>
            <a href="gerir-espacos.html" class="nav-link" data-nav="gerir-espacos" data-admin-nav hidden><i data-lucide="image-plus"></i> Gerir espaços</a>
          </nav>
          <nav class="sidebar-nav account-nav"><a href="https://antoniorappleton.github.io/" class="nav-link text-danger" data-signout><i data-lucide="log-out"></i> Terminar sessão</a></nav>
        </div>
      </aside>
      <div class="sidebar-overlay" id="sidebarOverlay"></div>
      <div class="main-wrapper">
        <header class="top-bar"><div class="top-bar-left"><button class="icon-btn menu-btn mobile-only" id="openSidebar" aria-label="Abrir menu"><i data-lucide="menu"></i></button><h1 class="page-title">Dashboard</h1></div><a href="minhas-reservas.html" class="profile-avatar" aria-label="As minhas reservas"><i data-lucide="user"></i></a></header>
        <main class="content-area">
          <div id="pageMessage" class="notice" role="status" hidden></div>
          <div class="section-heading"><div><h2>Resumo dos pedidos</h2><p class="text-muted">Acompanhe o estado das suas reservas.</p></div><a class="btn btn-primary" href="reserva.html">Pedir uma sala</a></div>
          <section id="dashboardStats" class="stats-grid" aria-label="Contagem de pedidos"></section>
          <section class="content-section"><h2>Próximos pedidos</h2><div id="dashboardReservations"><p class="text-muted">A carregar pedidos…</p></div></section>
        </main>
        <nav class="bottom-nav mobile-only"><a href="dashboard.html" class="nav-item" data-nav="dashboard"><i data-lucide="layout-dashboard"></i><span>Início</span></a><a href="reserva.html" class="nav-item" data-nav="reserve"><i data-lucide="calendar-plus"></i><span>Pedir</span></a><a href="index.html" class="nav-item" data-nav="spaces"><i data-lucide="compass"></i><span>Espaços</span></a><a href="minhas-reservas.html" class="nav-item" data-nav="reservations"><i data-lucide="list"></i><span>Pedidos</span></a></nav>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://antoniorappleton.github.io/direcao-turma/js/core/config.js"></script>
    <script src="https://antoniorappleton.github.io/direcao-turma/js/core/session.js"></script>
    <script src="https://antoniorappleton.github.io/direcao-turma/js/core/auth.js"></script>
    <script src="app.js"></script>
  </body>
</html>
